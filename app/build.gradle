plugins { id 'com.android.application' }

android {
    namespace 'com.waheed.aiaagent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.waheed.aiaagent'
        minSdk 26
        targetSdk 35
        versionCode 41
        versionName '4.1'
    }

    signingConfigs {
        ciRelease {
            storeFile file(System.getProperty("user.home") + "/waheed-agent-release.jks")
            storePassword "changeit"
            keyAlias "waheed"
            keyPassword "changeit"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ciRelease
        }
    }
}

dependencies {
}
