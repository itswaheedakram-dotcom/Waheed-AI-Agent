plugins { id 'com.android.application' }

android {
    namespace 'com.waheed.aiaagent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.waheed.aiaagent'
        minSdk 26
        targetSdk 35
        versionCode 52
        versionName '5.2'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DLLAMA_DIR=${project.rootDir}/../llama.cpp"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
}
