name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create CI release signing key
        run: |
          keytool -genkeypair -v             -keystore "$HOME/waheed-agent-release.jks"             -storepass "changeit"             -keypass "changeit"             -alias "waheed"             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Waheed AI Agent, OU=Mobile, O=Waheed AI Agent, L=Pakistan, ST=Punjab, C=PK"

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Waheed-AI-Agent-v4.1.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Waheed-AI-Agent-v4.1-release
          path: app/build/outputs/apk/release/Waheed-AI-Agent-v4.1.apk
          if-no-files-found: error
